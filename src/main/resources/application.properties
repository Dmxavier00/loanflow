spring.application.name=loanflow

spring.datasource.url=${LOANFLOW_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=loanflow;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${LOANFLOW_DB_USERNAME:loanflow_user}
spring.datasource.password=${LOANFLOW_DB_PASSWORD:Loanflow@12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Defaults locais para permitir executar a API pela IDE sem script auxiliar.
loanflow.jwt.secret=${JWT_SECRET:loanflow-demo-secret-change-me-loanflow-demo-secret-change-me}
loanflow.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
loanflow.contract.storage-path=${CONTRACT_STORAGE_PATH:contratos}
loanflow.signature.challenge-ttl-minutes=${SIGNATURE_CHALLENGE_TTL_MINUTES:10}
loanflow.signature.term-version=${SIGNATURE_TERM_VERSION:v1}
loanflow.signature.challenge-length=${SIGNATURE_CHALLENGE_LENGTH:6}
